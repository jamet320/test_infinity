name: Port Infinity-X A16 Mi8937 -> mido

on:
  workflow_dispatch:
    inputs:
      mido_base_url:
        description: "Direct download URL ROM/base A16 mido"
        required: true
        type: string

      keep_gapps:
        description: "Keep donor GApps"
        required: false
        default: true
        type: boolean

jobs:
  port:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            aria2 \
            android-sdk-libsparse-utils \
            android-sdk-ext4-utils \
            lz4 \
            brotli \
            zip \
            unzip \
            p7zip-full \
            e2fsprogs \
            erofs-utils \
            python3 \
            python3-pip \
            git \
            wget \
            curl

      - name: Download Mi8937 donor
        env:
          DONOR_URL: >-
            https://sourceforge.net/projects/alifc105-roms/files/Mi8937/Infinity%20X/A16/3.12%20GAPPS%20-%2009.09.2026/Project_Infinity-X-3.12-Mi8937-09.09.2026-GAPPS-UNOFFICIAL.zip/download
        run: |
          mkdir -p work/{donor,mido,out,tools}

          aria2c \
            --allow-overwrite=true \
            --file-allocation=none \
            -x16 -s16 \
            -o donor.zip \
            "$DONOR_URL"

          unzip -l donor.zip | head -100

          unzip -q donor.zip -d work/donor

      - name: Download mido base
        env:
          MIDO_URL: ${{ inputs.mido_base_url }}
        run: |
          cd work/mido

          aria2c \
            --allow-overwrite=true \
            --file-allocation=none \
            -x16 -s16 \
            -o mido-base.zip \
            "$MIDO_URL"

          unzip -q mido-base.zip

          echo "===== MIDO BASE ====="
          find . -maxdepth 2 -type f | sort | head -200

      - name: Inspect ROM layouts
        run: |
          echo "===== DONOR ====="
          find work/donor -maxdepth 3 -type f | sort

          echo
          echo "===== MIDO ====="
          find work/mido -maxdepth 3 -type f | sort

      - name: Extract donor super
        shell: bash
        run: |
          set -eux

          cd work/donor

          if [ -f payload.bin ]; then
            echo "payload.bin detected"

            git clone --depth=1 \
              https://github.com/ssut/payload-dumper-go.git \
              ../tools/payload-dumper-go

            ../tools/payload-dumper-go/payload-dumper-go \
              payload.bin

            mv output/* .
            rm -rf output
          fi

          if [ -f super.img ]; then
            echo "super.img detected"
            mkdir -p super
            lpunpack super.img super
          fi

          echo "===== DONOR PARTITIONS ====="
          find . -maxdepth 2 -type f | sort

      - name: Extract mido super
        shell: bash
        run: |
          set -eux

          cd work/mido

          if [ -f payload.bin ]; then
            echo "mido payload.bin detected"

            ../tools/payload-dumper-go/payload-dumper-go \
              payload.bin

            mv output/* .
            rm -rf output
          fi

          if [ -f super.img ]; then
            echo "mido super.img detected"
            mkdir -p super
            lpunpack super.img super
          fi

          echo "===== MIDO PARTITIONS ====="
          find . -maxdepth 2 -type f | sort

      - name: Find partition images
        run: |
          echo "DONOR:"
          find work/donor -type f \
            \( -name 'system*.img' \
            -o -name 'product*.img' \
            -o -name 'system_ext*.img' \
            -o -name 'vendor*.img' \
            -o -name 'odm*.img' \) \
            -print

          echo
          echo "MIDO:"
          find work/mido -type f \
            \( -name 'system*.img' \
            -o -name 'product*.img' \
            -o -name 'system_ext*.img' \
            -o -name 'vendor*.img' \
            -o -name 'odm*.img' \) \
            -print

      - name: Prepare images
        shell: bash
        run: |
          set -eux

          mkdir -p work/port/{donor,mido,mount}

          find work/donor -type f \
            \( -name 'system*.img' \
            -o -name 'product*.img' \
            -o -name 'system_ext*.img' \) \
            -exec cp {} work/port/donor/ \;

          find work/mido -type f \
            \( -name 'vendor*.img' \
            -o -name 'odm*.img' \) \
            -exec cp {} work/port/mido/ \;

          echo "===== DONOR SYSTEM SIDE ====="
          ls -lh work/port/donor || true

          echo "===== MIDO HARDWARE SIDE ====="
          ls -lh work/port/mido || true

      - name: Extract images for port analysis
        shell: bash
        run: |
          set -eux

          for img in work/port/donor/*.img work/port/mido/*.img; do
            [ -f "$img" ] || continue

            echo
            echo "===== $img ====="

            file "$img"

            if simg2img "$img" "${img}.raw" 2>/dev/null; then
              echo "Converted sparse image"
            else
              cp "$img" "${img}.raw"
            fi

            file "${img}.raw"
          done

      - name: Inspect Android properties
        shell: bash
        run: |
          set -eux

          mkdir -p work/inspect

          for img in work/port/donor/*.raw work/port/mido/*.raw; do
            [ -f "$img" ] || continue

            name="$(basename "$img")"
            mkdir -p "work/inspect/$name"

            if sudo mount -o loop,ro "$img" \
              "work/inspect/$name" 2>/dev/null; then

              echo
              echo "===== $name ====="

              if [ -f "work/inspect/$name/build.prop" ]; then
                grep -E \
                  '^(ro\.build|ro\.product|ro\.vendor|ro\.hardware|ro\.boot|ro\.soc)' \
                  "work/inspect/$name/build.prop" || true
              fi

              sudo umount "work/inspect/$name" || true
            fi
          done

      - name: Generate port report
        run: |
          {
            echo "# Mi8937 -> mido A16 port report"
            echo
            echo "## Donor"
            unzip -l donor.zip | tail -20
            echo
            echo "## Donor partition images"
            find work/donor -type f -name '*.img' -printf '%p %s bytes\n'
            echo
            echo "## Mido partition images"
            find work/mido -type f -name '*.img' -printf '%p %s bytes\n'
            echo
            echo "## Host"
            uname -a
            df -h
          } > work/port-report.md

      - name: Build initial port package
        shell: bash
        run: |
          set -eux

          mkdir -p work/out/MI8937_TO_MIDO

          cp work/port-report.md \
            work/out/MI8937_TO_MIDO/

          cp donor.zip \
            work/out/MI8937_TO_MIDO/donor-mi8937.zip

          cat > work/out/MI8937_TO_MIDO/README.txt <<'EOF'
          Mi8937 -> Redmi Note 4 mido A16 port workspace

          DONOR:
          Infinity-X 3.12 A16 Mi8937

          IMPORTANT:
          This is an automated port workspace/report.
          Hardware-specific Mi8937 vendor/odm/kernel images are NOT
          blindly flashed to mido.

          The next stage must construct the final mido super image
          using the verified mido hardware stack.
          EOF

          cd work/out
          zip -r ../../mido-a16-port-workspace.zip MI8937_TO_MIDO

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mido-a16-port-workspace
          path: mido-a16-port-workspace.zip
          compression-level: 0
